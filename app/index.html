<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f1e7" />
<title>Einbürgerungstest Trainer — Berlin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2552f'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='sans-serif' font-size='30' fill='white'%3EEB%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" data-go="#/home" title="Home">
        <span class="brand-mark">EB</span>
        <span class="brand-text">Einbürgerungstest<span class="brand-sub">Berlin · 310 Fragen</span></span>
      </button>
      <nav class="tabs" id="tabs" aria-label="Study modes">
        <a href="#/learn" data-tab="learn">Learn</a>
        <a href="#/vocab" data-tab="vocab">Vocab</a>
        <a href="#/browse" data-tab="browse">Browse</a>
        <a href="#/quiz" data-tab="quiz">Quiz</a>
        <a href="#/exam" data-tab="exam">Exam</a>
        <a href="#/focus" data-tab="focus">Focus</a>
        <a href="#/stats" data-tab="stats">Stats</a>
      </nav>
      <div class="topbar-actions">
        <button id="langToggle" class="chip" title="Toggle question/answer language">DE</button>
        <button id="themeToggle" class="chip" title="Toggle light / dark">◐</button>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"><!-- rendered by app.js --></main>

  <footer class="footer">
    <span id="footerNote">Questions © Bundesamt für Migration und Flüchtlinge · answer key from oet.bamf.de</span>
  </footer>
</div>

<!-- Data first (window.QUESTIONS / window.LESSONS) so it works from file:// with no server. -->
<script src="data/questions.js"></script>
<script src="data/lessons.js"></script>
<script src="data/vocab.js"></script>
<!-- App scripts, plain (no ES modules) for offline double-click robustness. -->
<script src="js/store.js"></script>
<script src="js/data.js"></script>
<script src="js/session.js"></script>
<script src="js/ui.js"></script>
<script src="js/learn.js"></script>
<script src="js/vocab.js"></script>
<script src="js/app.js"></script>
</body>
</html>
